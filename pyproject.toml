[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "prime-sdk-py"
version = "1.8.0"
description = "Coinbase Prime Python SDK"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    "requests",
]

[project.optional-dependencies]
dev = [
    "datamodel-code-generator>=0.60.0",
    "jinja2>=3.1.0",
    "pyyaml>=6.0",
    "ruff>=0.4.0",
    "pytest>=7.0",
    "build>=1.0",
]

[project.urls]
Source = "https://github.com/coinbase/prime-sdk-py"
"Issue Tracker" = "https://github.com/coinbase/prime-sdk-py/issues"

[tool.setuptools.packages.find]
exclude = ["prime_sdk.examples", "prime_sdk.examples.*", "tests", "tests.*", "tools", "tools.*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
